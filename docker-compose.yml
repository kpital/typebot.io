version: '3.3'

services:
  typebot-db:
    image: postgres:14-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  typebot-builder:
    image: roylansk/typebot-builder-kpital:latest
    restart: always
    depends_on:
      - typebot-db
      # - minio
    ports:
      - '8888:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: .env

  typebot-viewer:
    image: roylansk/typebot-viewer-kpital:latest
    restart: always
    ports:
      - '8889:3000'
    env_file: .env

